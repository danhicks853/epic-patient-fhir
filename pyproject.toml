[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-patient-fhir"
version = "0.1.0"
description = "MCP server and CLI for reading your own medical record from Epic (MyChart) via SMART on FHIR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2"]

[project.scripts]
epic-patient-fhir = "epic_patient_fhir.cli:main"
epic-patient-fhir-mcp = "epic_patient_fhir.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epic_patient_fhir = ["*.json"]
