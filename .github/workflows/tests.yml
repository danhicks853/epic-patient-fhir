name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest -v tests/test_offline.py tests/test_mcp.py tests/test_cli.py
        env:
          PYTHONPATH: src${{ runner.os == 'Windows' && ';' || ':' }}tests
          NO_PROXY: 127.0.0.1,localhost
